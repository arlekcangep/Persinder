[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persinder"
version = "0.0.1"
description = "Персональный индексатор: поисковый движок для личной базы знаний"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stemming = ["snowballstemmer>=2.2"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
persinder = "persinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
