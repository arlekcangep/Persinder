[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persinder"
version = "0.0.1"
description = "Персональный индексатор: поисковый движок для личной базы знаний"
requires-python = ">=3.10"
# onnxruntime — обязательная зависимость (есть официальные колеса для
# Windows/Linux/macOS): Persinder работает «из коробки», Docker не нужен.
# Сама модель весит ~120 МБ и управляется отдельно (persinder model install).
# usearch — ANN-движок векторного поиска (модуль 3, §8): официальные колеса
# Windows/Linux/macOS, mmap-индекс на диск, без демонов в простое.
dependencies = ["onnxruntime>=1.19", "tokenizers>=0.19", "usearch>=2.26"]

[project.optional-dependencies]
stemming = ["snowballstemmer>=2.2"]
config = ["PyYAML>=6.0"]
watch = ["watchdog>=4.0"]
pdf = ["pypdf>=4.0"]
rtf = ["striprtf>=0.0.35"]
archive7z = ["py7zr>=1.0"]
archiverar = ["rarfile>=4.0"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
persinder = "persinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

# Собранный веб-клиент едет внутри пакета: `persinder serve` раздаёт его сам.
[tool.setuptools.package-data]
"persinder.api" = ["static/*", "static/assets/*"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# venv проекта (вне vboxfs) — чтобы pyright видел опциональные зависимости
# (PyYAML, pypdf); при отсутствии venv падает обратно на системный Python.
venvPath = "/home/appuser/venvs"
venv = "persinder"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
