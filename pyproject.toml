[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "persinder"
version = "0.0.1"
description = "Персональный индексатор: поисковый движок для личной базы знаний"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
stemming = ["snowballstemmer>=2.2"]
config = ["PyYAML>=6.0"]
watch = ["watchdog>=4.0"]
pdf = ["pypdf>=4.0"]
http = ["fastapi>=0.110", "uvicorn>=0.29"]
onnx = ["onnxruntime>=1.19", "tokenizers>=0.19"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10", "types-PyYAML"]

[project.scripts]
persinder = "persinder.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pyright]
include = ["src", "tests"]
exclude = ["**/__pycache__"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
# venv проекта (вне vboxfs) — чтобы pyright видел опциональные зависимости
# (PyYAML, pypdf); при отсутствии venv падает обратно на системный Python.
venvPath = "/home/appuser/opencodetmp/venvs"
venv = "persinder"

[tool.ruff]
line-length = 88
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["N802"]
